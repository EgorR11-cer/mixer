name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Ключ подписи
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS" ]  [ -z "$KP" ]  [ -z "$KA" ]; then echo "::error::Не заданы секреты"; exit 1; fi
          echo "$KS" | base64 -d > android/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KP" "$KA" "$KP" > android/keystore.properties
      - name: Сборка APK
        run: |
          N=$((100 + ${{ github.run_number }}))
          chmod +x gradlew
          ./gradlew assembleRelease -PVERSION_CODE=$N -PVERSION_NAME=1.$N
          cp app/build/outputs/apk/release/app-release.apk ../Mixer.apk
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Mixer.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: windows
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name Mixer --hidden-import win32timezone --collect-submodules webview mixer_agent.py
        working-directory: windows
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: windows/dist/Mixer.exe
  release:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$((100 + ${{ github.run_number }}))
          gh release create "v$N" out/apk/Mixer.apk out/exe/Mixer.exe --repo "$GITHUB_REPOSITORY" --title "Микшер 1.$N" --notes "Android: Mixer.apk. Windows: Mixer.exe."
