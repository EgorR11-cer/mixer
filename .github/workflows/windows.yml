name: Windows EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: windows
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name Mixer --hidden-import win32timezone --collect-submodules webview mixer_agent.py
        working-directory: windows
      - uses: actions/upload-artifact@v4
        with:
          name: Mixer-exe
          path: windows/dist/Mixer.exe
